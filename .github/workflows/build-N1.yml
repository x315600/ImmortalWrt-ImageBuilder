      include_openclash:
        description: 'OpenClash 0.48.002 + 独立 Mihomo 1.19.32（首启停用）'
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      include_docker:
        description: |
          是否编译 Docker 插件
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      enable_store:
        description: "集成 store 商店"
        required: false
        type: boolean
        default: true
      skip_imagebuilder:
        description: "直接使用底包快速构建固件, 忽略自定义插件 ----（跳过 ImageBuilder）"
        required: false
        default: false
        type: boolean
      replace_banner:
        description: '替换为ImmortalWrt的banner信息'
        required: false
        default: false
        type: boolean
      rootfs_partsize:
        description: '软件包大小1G固定'
        required: true
        default: "1024"
        type: choice
        options:
          - '1024'
      builder_name:
        description: "设置打包作者的名称"
        required: true
        default: 'wukongdaily'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set executable permissions
        run: chmod +x ${{ github.workspace }}/n1/build.sh

      - name: Debug workspace contents
        run: ls -R
      
      - name: Enable Store integration
        run: |
          if [ "${{ github.event.inputs.enable_store }}" == "true" ]; then
            echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-store"' >> shell/custom-packages.sh
            echo "✅ 已追加 luci-app-store"
          else
            echo "❎ 未启用 luci-app-store"
          fi

      - name: 处理是否替换 banner 信息
        if: ${{ github.event.inputs.skip_imagebuilder == 'false' && github.event.inputs.replace_banner == 'true' }}
        run: |
          # 使用ImageBuilder构建 且用户勾选了替换banner时
          cp n1/99-banner.sh files/etc/uci-defaults/

      - name: Configure N1 bypass router defaults
        if: ${{ github.event.inputs.skip_imagebuilder != 'true' }}
        run: |
          set -euo pipefail
          install -d files/etc/uci-defaults files/etc/nikki/profiles
          install -m 0755 n1/99-n1-bypass-router.sh files/etc/uci-defaults/
          install -m 0755 n1/99-install-subs-check.sh files/etc/uci-defaults/
          install -m 0755 n1/zzz-n1-nikki.sh files/etc/uci-defaults/
          install -m 0600 n1/nikki-dual.yaml files/etc/nikki/profiles/nikki-dual.yaml
          # N1-only clean FRP config: never change or mount the shared credentialed file.
          install -d .build/n1-overlay/etc/config
          install -m 0600 n1/frpc.config .build/n1-overlay/etc/config/frpc

      - name: Stage locked and signature-verified ARM64 inputs
        if: ${{ github.event.inputs.skip_imagebuilder != 'true' }}
        env:
          INCLUDE_OPENCLASH: ${{ inputs.include_openclash }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-cryptography python3-yaml ripgrep
          /usr/bin/python3 n1/prepare-inputs.py --include-openclash "$INCLUDE_OPENCLASH"
          /usr/bin/python3 n1/tests/test_freeze_reload.py
          NIKKI_OFFICIAL_ROOT="$PWD/.build/n1-inputs/official-root" /usr/bin/python3 n1/tests/test_firstboot.py
          mkdir -p files/etc/openclash files/opt bin/n1-audit
          cp n1/inputs.lock.json bin/n1-audit/
          cp .build/n1-inputs/inputs-manifest.json bin/n1-audit/
          git rev-parse HEAD > bin/n1-audit/source-commit.txt

      - name: Building N1 ImmortalWrt rootfs 24.10.x
        if: ${{ github.event.inputs.skip_imagebuilder != 'true' }}
        run: |
          echo "✅ 使用 ImageBuilder 构建 rootfs"
          profiles="generic"
          include_docker="${{ github.event.inputs.include_docker }}"
          include_openclash="${{ github.event.inputs.include_openclash }}"
          enable_store="${{ github.event.inputs.enable_store }}"
          rootfs_partsize="${{ github.event.inputs.rootfs_partsize }}"
          luci_version="${{ github.event.inputs.luci_version }}"
          
          set -euo pipefail
          image="immortalwrt/imagebuilder:armsr-armv8-openwrt-${luci_version}"
          docker pull "$image"
          image_id=$(docker image inspect --format '{{.Id}}' "$image")
          docker image inspect "$image_id" > bin/n1-audit/docker-image.json
          printf '%s\n' "$image_id" > bin/n1-audit/docker-image-id.txt
          printf 'luci=%s\nkernel=%s\nopenclash=%s\ndocker=%s\nstore=%s\n' \
            "$luci_version" '${{ inputs.openwrt_kernel }}' "$include_openclash" "$include_docker" "$enable_store" \
            > bin/n1-audit/build-options.txt
          IFS=',' read -r -a profile_array <<< "$profiles"
          
          for profile in "${profile_array[@]}"; do
            echo "Building for profile: $profile"
            
            docker run --rm -i \
              --user root \
              -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
              -v "${{ github.workspace }}/files/etc/uci-defaults:/home/build/immortalwrt/files/etc/uci-defaults" \
              -v "${{ github.workspace }}/files/opt:/home/build/immortalwrt/files/opt" \
              -v "${{ github.workspace }}/.build/n1-inputs:/home/build/immortalwrt/n1-inputs:ro" \
              -v "${{ github.workspace }}/n1:/home/build/immortalwrt/n1:ro" \
              -v "${{ github.workspace }}/files/etc/openclash:/home/build/immortalwrt/files/etc/openclash" \
              -v "${{ github.workspace }}/files/etc/nikki:/home/build/immortalwrt/files/etc/nikki" \
              -v "${{ github.workspace }}/.build/n1-overlay/etc/config/frpc:/home/build/immortalwrt/files/etc/config/frpc:ro" \
              -v "${{ github.workspace }}/arch/arch.conf:/home/build/immortalwrt/files/etc/opkg/arch.conf" \
              -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
              -v "${{ github.workspace }}/n1/banner:/home/build/immortalwrt/files/mnt/banner" \
              -v "${{ github.workspace }}/n1/imm.config:/home/build/immortalwrt/.config" \
              -v "${{ github.workspace }}/n1/build.sh:/home/build/immortalwrt/build.sh" \
              -e PROFILE=$profile \
              -e INCLUDE_DOCKER=$include_docker \
              -e INCLUDE_OPENCLASH=$include_openclash \
              -e ENABLE_STORE=$enable_store \
              -e ROOTFS_PARTSIZE=$rootfs_partsize \
              "$image_id" /bin/bash -ec 'command -v rg >/dev/null || { apt-get update && apt-get install -y ripgrep; }; exec /bin/bash /home/build/immortalwrt/build.sh'
          done
          
      - name: Download prebuilt rootfs.tar.gz
        if: ${{ github.event.inputs.skip_imagebuilder == 'true' }}
        run: |
          echo "📦 正在下载预构建 rootfs"
          echo "PREBUILT_LUCI_VERSION=24.10.2" >> $GITHUB_ENV
          mkdir -p bin/targets/armsr/armv8
          curl -L -o bin/targets/armsr/armv8/openwrt-armvirt-64-default-rootfs.tar.gz \
            https://github.com/wukongdaily/AutoBuildImmortalWrt/releases/download/rootfs/immortalwrt-24.10.2-armsr-armv8-generic-rootfs.tar.gz

      - name: 查找rootfs.tar.gz所在路径
        id: find_rootfs
        run: |
          ROOTFS_FILE=$(find bin/targets/armsr/armv8/ -type f -name "*rootfs.tar.gz" | head -n1)
          echo "✅ Found: $ROOTFS_FILE"
          if [ ! -f "$ROOTFS_FILE" ]; then
            echo "❌ 找不到 rootfs.tar.gz 文件"
            exit 1
          fi
          echo "file=$ROOTFS_FILE" >> $GITHUB_OUTPUT

      - name: Package armsr-armv8 as ImmortalWrt for N1
        uses: wukongdaily/flippy-openwrt-actions@master
        env:
          OPENWRT_ARMVIRT: ${{ steps.find_rootfs.outputs.file }}
          PACKAGE_SOC: s905d
          KERNEL_VERSION_NAME: ${{ inputs.openwrt_kernel }}
          KERNEL_AUTO_LATEST: false
          WHOAMI: ${{ inputs.builder_name }}

      - name: Rename .img.gz file
        id: rename
        run: |
          FILE=$(ls ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz | head -n1)
          echo "Image file is: $FILE"
          FILENAME=$(basename "$FILE")
          echo "FILENAME=$FILENAME" >> $GITHUB_ENV
          KERNEL_VERSION=$(echo "$FILENAME" | grep -oP 'k\d+\.\d+\.\d+')
          LUCI_VERSION="${{ github.event.inputs.luci_version }}"

          if [ -n "$PREBUILT_LUCI_VERSION" ]; then
             echo "PREBUILT_LUCI_VERSION is not empty: $PREBUILT_LUCI_VERSION"
             mv "$FILE" "${{ env.PACKAGED_OUTPUTPATH }}/immortalwrt-$PREBUILT_LUCI_VERSION-phicomm-n1-btrfs-$KERNEL_VERSION.img.gz"
          else
             mv "$FILE" "${{ env.PACKAGED_OUTPUTPATH }}/immortalwrt-$LUCI_VERSION-phicomm-n1-btrfs-$KERNEL_VERSION.img.gz"
          fi


      - name: Generate final image checksums and audit archive
        env:
          OUTPUT_DIR: ${{ env.PACKAGED_OUTPUTPATH }}
        run: |
          set -euo pipefail
          mkdir -p bin/n1-audit
          python3 n1/build-audit.py final --root "$OUTPUT_DIR" --output bin/n1-audit
          cp bin/n1-audit/SHA256SUMS "$OUTPUT_DIR/SHA256SUMS"
          python3 n1/release-info.py --skip-imagebuilder '${{ inputs.skip_imagebuilder }}'
          cp bin/n1-audit/BUILD-INFO.md "$OUTPUT_DIR/BUILD-INFO.md"
          tar -czf "$OUTPUT_DIR/n1-build-audit.tar.gz" -C bin n1-audit

      - name: Upload build audit even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: n1-build-audit
          path: bin/n1-audit/
          if-no-files-found: warn

      - name: Upload firmware to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: phicomm-n1
          name: ImmortalWrt for Phicomm N1
          body_path: ${{ github.workspace }}/bin/n1-audit/release-notes.md
          files: |
            ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz
            ${{ env.PACKAGED_OUTPUTPATH }}/SHA256SUMS
            ${{ env.PACKAGED_OUTPUTPATH }}/n1-build-audit.tar.gz
            ${{ env.PACKAGED_OUTPUTPATH }}/BUILD-INFO.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
